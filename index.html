  if (imp) imp.addEventListener('change', async () => {
    const f = imp.files[0];
    if (!f) return;
    try { await importarAlumnosEnJardin(f); } finally { imp.value = ''; }
  });
  attachCardListHandlers();
}

// The search input lives in the topbar, which stays untouched during search-only re-renders,
// so this node can persist across many renders. Guard with a flag to avoid stacking a new
// "input" listener on it every keystroke (which previously caused runaway re-renders).
function wireSearchInputOnce() {
  const searchInput = document.getElementById('searchInput');
  if (!searchInput || searchInput.dataset.wired) return;
  searchInput.dataset.wired = '1';
  searchInput.addEventListener('input', () => { ui.search = searchInput.value; renderSearchOnly(); });
}

function attachCardListHandlers() {
  const list = document.getElementById('cardList');
  if (!list) return;
  list.addEventListener('input', onFieldChange);
  list.addEventListener('change', onFieldChange);
  list.addEventListener('click', onFotoClick);
  list.addEventListener('click', onQtyClick);
  list.addEventListener('click', onAgregarAlumnoClick);
  list.addEventListener('click', onEliminarAlumnoClick);
  list.addEventListener('keydown', onFotoKeydown);
}

function onAgregarAlumnoClick(e) {
  const btn = e.target.closest('#btnAgregarAlumno');
  if (!btn) return;
  const nuevo = Object.assign(
    { id: uid('al'), turno: ui.turno, sala: ui.sala, apellido: 'Apellido', nombre: 'Nombre' },
    defaultAlumnoFields()
  );
  cur().alumnos.push(nuevo);
  saveState();
  render();
  const cardEl = document.querySelector(`.alumno-card[data-id="${nuevo.id}"]`);
  if (cardEl) {
    cardEl.setAttribute('open', '');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const apellidoInput = cardEl.querySelector('[data-field="apellido"]');
    if (apellidoInput) { apellidoInput.focus(); apellidoInput.select(); }
  }
}

function onEliminarAlumnoClick(e) {
  const btn = e.target.closest('[data-delete-alumno]');
  if (!btn) return;
  const alumno = cur().alumnos.find(a => a.id === btn.dataset.deleteAlumno);
  if (!alumno) return;
  const ok = confirm(`¿Eliminar a ${alumno.apellido}, ${alumno.nombre} de la lista? No se puede deshacer.`);
  if (!ok) return;
  cur().alumnos = cur().alumnos.filter(a => a.id !== alumno.id);
  saveState();
  render();
}

function onQtyClick(e) {
  const btn = e.target.closest('[data-qty-action]');
  if (!btn) return;
  const cardEl = e.target.closest('.alumno-card');
  const alumno = cur().alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  const productId = btn.closest('.qty-stepper').dataset.product;
  const current = Number(alumno.productos[productId]) || 0;
  const next = btn.dataset.qtyAction === 'inc' ? current + 1 : Math.max(0, current - 1);
  alumno.productos[productId] = next;
  saveState();

  const row = cardEl.querySelector(`[data-product-row="${productId}"]`);
  row.querySelector('[data-role="qtyValue"]').textContent = next;
  row.classList.toggle('active', next > 0);
  updateCardComputed(cardEl, alumno);
  updateSalaChipCounts();
}

function onFotoClick(e) {
  const addBtn = e.target.closest('[data-add-foto]');
  const removeBtn = e.target.closest('[data-remove-foto]');
  if (!addBtn && !removeBtn) return;
  const cardEl = e.target.closest('.alumno-card');
  const alumno = cur().alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  if (addBtn) addFotoFromCard(cardEl, alumno, addBtn.dataset.addFoto);
  if (removeBtn) removeFoto(cardEl, alumno, removeBtn.dataset.removeFoto, removeBtn.dataset.value);
}

function onFotoKeydown(e) {
  if (e.key !== 'Enter') return;
  const input = e.target.closest('[data-foto-input]');
  if (!input) return;
  e.preventDefault();
  const cardEl = e.target.closest('.alumno-card');
  const alumno = cur().alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  addFotoFromCard(cardEl, alumno, input.dataset.fotoInput);
}

function addFotoFromCard(cardEl, alumno, tipo) {
  const input = cardEl.querySelector(`[data-foto-input="${tipo}"]`);
  const val = input.value.trim();
  if (!val) return;
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  if (!arr.includes(val)) arr.push(val);
  input.value = '';
  saveState();
  refreshFotoChips(cardEl, alumno, tipo);
  input.focus();
}

function removeFoto(cardEl, alumno, tipo, value) {
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  const idx = arr.indexOf(value);
  if (idx > -1) arr.splice(idx, 1);
  saveState();
  refreshFotoChips(cardEl, alumno, tipo);
}

function refreshFotoChips(cardEl, alumno, tipo) {
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  const container = cardEl.querySelector(`.foto-chips[data-foto-type="${tipo}"]`);
  if (container) container.innerHTML = renderFotoChipsHtml(arr, tipo);
}

// Re-render only the list + chips on search keystrokes, keep focus in the search box.
function renderSearchOnly() {
  const viewport = document.getElementById('viewport');
  const caretPos = document.getElementById('searchInput') ? document.getElementById('searchInput').selectionStart : null;
  viewport.innerHTML = renderFichas();
  attachTurnoSalaAndListHandlers();
  wireSearchInputOnce();
  const input = document.getElementById('searchInput');
  if (input) {
    input.focus();
    if (caretPos !== null) input.setSelectionRange(caretPos, caretPos);
  }
}

function onFieldChange(e) {
  const cardEl = e.target.closest('.alumno-card');
  if (!cardEl) return;
  const id = cardEl.dataset.id;
  const alumno = cur().alumnos.find(a => a.id === id);
  if (!alumno) return;

  if (e.target.dataset.field) {
    const field = e.target.dataset.field;
    if (field === 'montoAbonado') {
      alumno[field] = Number(e.target.value) || 0;
    } else {
      alumno[field] = e.target.value;
    }
    if (field === 'estadoPago') {
      const montoField = cardEl.querySelector('[data-role="montoAbonadoField"]');
      if (montoField) montoField.hidden = (e.target.value !== 'sena');
    }
    if (field === 'apellido' || field === 'nombre') {
      const nameEl = cardEl.querySelector('.alumno-name');
      if (nameEl) nameEl.textContent = `${alumno.apellido}, ${alumno.nombre}`;
    }
  } else {
    return;
  }

  if (e.type === 'input') {
    saveStateDebounced();
  } else {
    saveState();
  }
  updateCardComputed(cardEl, alumno);
  updateSalaChipCounts();
}

let saveTimer = null;
function saveStateDebounced() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}

function updateCardComputed(cardEl, alumno) {
  const total = calcTotal(alumno);
  const cobrado = calcCobrado(alumno);
  const saldo = calcSaldo(alumno);
  const st = statusInfo(alumno);

  const pillEl = cardEl.querySelector('[data-role="pill"]');
  pillEl.textContent = st.label;
  pillEl.className = 'pill ' + st.cls;

  cardEl.querySelector('[data-role="total"]').textContent = total > 0 ? money(total) : '—';
  cardEl.querySelector('[data-role="totalLine"]').textContent = money(total);
  cardEl.querySelector('[data-role="cobradoLine"]').textContent = money(cobrado);
  cardEl.querySelector('[data-role="saldoLine"]').textContent = money(saldo);
}

function updateSalaChipCounts() {
  document.querySelectorAll('.sala-chip').forEach(chip => {
    const sala = chip.dataset.sala;
    if (!sala) return;
    const alumnosSala = cur().alumnos.filter(a => a.turno === ui.turno && a.sala === sala);
    const pedidos = alumnosSala.filter(a => calcTotal(a) > 0).length;
    const nEl = chip.querySelector('.n');
    if (nEl) nEl.textContent = `${alumnosSala.length} alumnos · ${pedidos} pedidos`;
  });
}

/* ===================== Vista: Estadísticas ===================== */

function renderStats() {
  const alumnosConPedido = cur().alumnos.filter(a => calcTotal(a) > 0);
  const totalVentas = alumnosConPedido.reduce((s, a) => s + calcTotal(a), 0);
  const totalCobrado = cur().alumnos.reduce((s, a) => s + calcCobrado(a), 0);
  const totalPendiente = totalVentas - totalCobrado;

  const porProducto = PRODUCTS.map(p => {
    const pedidos = cur().alumnos.filter(a => (Number(a.productos[p.id]) || 0) > 0).length;
    const cantidad = cur().alumnos.reduce((s, a) => s + (Number(a.productos[p.id]) || 0), 0);
    return { ...p, pedidos, cantidad, monto: cantidad * p.price };
  });

  const salasOrden = [];
  turnosList().forEach(t => (salasPorTurno()[t] || []).forEach(s => salasOrden.push({ turno: t, sala: s })));
  const porSala = salasOrden.map(({ turno, sala }) => {
    const alumnosSala = cur().alumnos.filter(a => a.turno === turno && a.sala === sala);
    const conPedido = alumnosSala.filter(a => calcTotal(a) > 0);
    return {
      turno, sala,
      totalAlumnos: alumnosSala.length,
      pedidos: conPedido.length,
      monto: conPedido.reduce((s, a) => s + calcTotal(a), 0),
    };
  });

  const periodos = aggregateByPeriod(alumnosConPedido, ui.periodo);

  const totalGastos = cur().gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const balance = totalVentas - totalGastos;
  const gastosPorProducto = Object.fromEntries(PRODUCTS.map(p => [p.id, 0]));
  let gastosGenerales = 0;
  cur().gastos.forEach(g => {
    if (gastosPorProducto.hasOwnProperty(g.productoId)) gastosPorProducto[g.productoId] += Number(g.monto) || 0;
    else gastosGenerales += Number(g.monto) || 0;
  });
  const margenPorProducto = porProducto.map(p => {
    const gasto = gastosPorProducto[p.id] || 0;
    const margen = p.monto - gasto;
    const margenPct = p.monto > 0 ? (margen / p.monto * 100) : null;
    return { ...p, gasto, margen, margenPct };
  });

  return `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Monto total vendido</div><div class="value">${money(totalVentas)}</div></div>
      <div class="kpi-card"><div class="label">Cobrado hasta ahora</div><div class="value">${money(totalCobrado)}</div></div>
      <div class="kpi-card"><div class="label">Pendiente de cobro</div><div class="value">${money(totalPendiente)}</div></div>
      <div class="kpi-card"><div class="label">Pedidos con al menos 1 producto</div><div class="value">${alumnosConPedido.length} <span style="font-size:0.9rem;color:var(--ink-faint)">/ ${cur().alumnos.length}</span></div></div>
    </div>

    <div class="stats-section">
      <h2>Ventas por producto</h2>
      <table class="data-table">
        <thead><tr><th>Producto</th><th class="num">Pedidos</th><th class="num">Cantidad vendida</th><th class="num">Precio</th><th class="num">Monto total</th></tr></thead>
        <tbody>
          ${porProducto.map(p => `<tr><td>${p.label}</td><td class="num">${p.pedidos}</td><td class="num">${p.cantidad}</td><td class="num">${money(p.price)}</td><td class="num">${money(p.monto)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Pedidos y ventas por sala</h2>
      <table class="data-table">
        <thead><tr><th>Turno</th><th>Sala</th><th class="num">Alumnos</th><th class="num">Pedidos</th><th class="num">Monto</th></tr></thead>
        <tbody>
          ${porSala.map(s => `<tr><td>${escapeHtml(s.turno)}</td><td>${escapeHtml(s.sala)}</td><td class="num">${s.totalAlumnos}</td><td class="num">${s.pedidos}</td><td class="num">${money(s.monto)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Ventas por período</h2>
      <div class="period-toggle" style="margin-bottom:10px">
        <button data-periodo="semana" class="${ui.periodo === 'semana' ? 'active' : ''}">Semana</button>
        <button data-periodo="quincena" class="${ui.periodo === 'quincena' ? 'active' : ''}">Quincena</button>
        <button data-periodo="mes" class="${ui.periodo === 'mes' ? 'active' : ''}">Mes</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Período</th><th class="num">Pedidos</th><th class="num">Monto vendido</th></tr></thead>
        <tbody>
          ${periodos.length ? periodos.map(p => `<tr><td>${escapeHtml(p.label)}</td><td class="num">${p.pedidos}</td><td class="num">${money(p.monto)}</td></tr>`).join('') : `<tr><td colspan="3" class="muted">Todavía no hay pedidos cargados.</td></tr>`}
        </tbody>
      </table>
      <div class="muted" style="margin-top:8px">Se agrupa según la "Fecha del pedido" cargada en cada ficha. Los pedidos sin fecha aparecen como "Sin fecha".</div>
    </div>

    <div class="stats-section">
      <h2>Balance del negocio</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="label">Ingresos (ventas)</div><div class="value">${money(totalVentas)}</div></div>
        <div class="kpi-card"><div class="label">Gastos totales</div><div class="value">${money(totalGastos)}</div></div>
        <div class="kpi-card"><div class="label">Balance</div><div class="value" style="color:${balance >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(balance)}</div></div>
      </div>
      <h2 style="margin-top:18px">Margen por producto</h2>
      <table class="data-table">
        <thead><tr><th>Producto</th><th class="num">Ventas</th><th class="num">Gastos asignados</th><th class="num">Margen</th><th class="num">Margen %</th></tr></thead>
        <tbody>
          ${margenPorProducto.map(p => `<tr><td>${p.label}</td><td class="num">${money(p.monto)}</td><td class="num">${money(p.gasto)}</td><td class="num">${money(p.margen)}</td><td class="num">${p.margenPct === null ? '—' : p.margenPct.toFixed(0) + '%'}</td></tr>`).join('')}
          ${gastosGenerales > 0 ? `<tr><td><i>General / sin producto asignado</i></td><td class="num">—</td><td class="num">${money(gastosGenerales)}</td><td class="num">—</td><td class="num">—</td></tr>` : ''}
        </tbody>
      </table>
      <div class="muted" style="margin-top:8px">Margen = ventas del producto menos los gastos que le asignaste en la sección Gastos. Los gastos "generales" se descuentan del balance total pero no afectan el margen de un producto puntual.</div>
    </div>

    <div class="stats-section">
      <h2>Planilla de pedidos para imprimir (Excel)</h2>
      <div class="export-panel">
        <div class="field-grid" style="margin:0">
          <div class="field">
            <label>Qué exportar</label>
            <select id="planillaScope">
              <option value="all">Todas las salas (una hoja por sala)</option>
              ${turnosList().map(t => `<option value="turno:${escapeAttr(t)}">Turno ${escapeHtml(t)} (una hoja por sala)</option>`).join('')}
              <option value="one">Todo junto en una sola hoja</option>
              ${turnosList().map(t => `<optgroup label="Una sala — ${escapeAttr(t)}">${(salasPorTurno()[t] || []).map(s => `<option value="sala:${escapeAttr(t)}|${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('')}</optgroup>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Alumnos a incluir</label>
            <select id="planillaFiltro">
              <option value="todos">Todos</option>
              <option value="pedido">Solo los que tienen pedido</option>
              <option value="saldo">Solo con saldo pendiente</option>
            </select>
          </div>
          <div class="field">
            <label>Orientación de la hoja</label>
            <select id="planillaOrient">
              <option value="landscape">Horizontal (recomendado)</option>
              <option value="portrait">Vertical</option>
            </select>
          </div>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="btnExportPlanilla">Descargar planilla (.xlsx)</button>
        </div>
        <div class="muted">Sale lista para imprimir en A4: todas las columnas entran a lo ancho de una hoja, el encabezado se repite en cada página y trae una fila de totales.</div>
      </div>
    </div>

    <div class="stats-section">
      <h2>Exportar listados</h2>
      <div class="export-panel">
        <div class="export-row">
          <select id="exportProductoSelect">
            ${PRODUCTS.map(p => `<option value="${p.id}">${p.label}</option>`).join('')}
          </select>
          <button class="btn" id="btnExportProducto">Exportar por producto (CSV)</button>
        </div>
        <div class="export-row">
          <select id="exportSalaSelect">
            ${salasOrden.map(({ turno, sala }) => `<option value="${escapeAttr(turno)}|${escapeAttr(sala)}">${turno} · ${sala}</option>`).join('')}
          </select>
          <button class="btn" id="btnExportSala">Exportar por sala (CSV)</button>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="btnExportTodo">Exportar listado completo (CSV)</button>
        </div>
        <div class="muted">Los CSV se abren directamente en Excel. El backup en JSON (en la pantalla de inicio) es para pasar todos los datos cargados a otra computadora o celular.</div>
      </div>
    </div>
  `;
}

function attachStatsHandlers() {
  document.getElementById('btnExportProducto').addEventListener('click', () => {
    const pid = document.getElementById('exportProductoSelect').value;
    exportPorProducto(pid);
  });
  document.getElementById('btnExportSala').addEventListener('click', () => {
    const [turno, sala] = document.getElementById('exportSalaSelect').value.split('|');
    exportPorSala(turno, sala);
  });
  document.getElementById('btnExportTodo').addEventListener('click', exportCompleto);
  document.getElementById('btnExportPlanilla').addEventListener('click', () => {
    exportPlanillaExcel(
      document.getElementById('planillaScope').value,
      document.getElementById('planillaFiltro').value,
      document.getElementById('planillaOrient').value
    );
  });
  document.querySelectorAll('[data-periodo]').forEach(btn => {
    btn.addEventListener('click', () => { ui.periodo = btn.dataset.periodo; render(); });
  });
}

/* ===================== Vista: Gastos ===================== */

function renderGastosJardin() {
  const gastosOrdenados = [...cur().gastos].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const totalGastos = cur().gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0);

  return `
    <div class="stats-section">
      <h2>Registrar gasto</h2>
      <div class="export-panel">
        <div class="field-grid" style="margin:0">
          <div class="field"><label>Fecha</label><input type="date" id="gastoFecha" value="${todayStr()}"></div>

          <div class="field">

            <select id="gastoCategoria">

          <div class="field">
            <label>Impacta en el producto</label>
            <select id="gastoProducto">
              <option value="general">General / sin producto específico</option>
              ${PRODUCTS.map(p => `<option value="${p.id}">${p.label}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Monto</label><input type="number" min="0" step="100" id="gastoMonto" value="0"></div>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="btnAgregarGasto">Agregar gasto</button>
        </div>
      </div>
    </div>

    <div class="stats-section">
      <h2>Gastos registrados <span class="muted">(total: ${money(totalGastos)})</span></h2>
      <table class="data-table">
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Producto</th><th class="num">Monto</th><th></th></tr></thead>
        <tbody>
          ${gastosOrdenados.length ? gastosOrdenados.map(g => `
            <tr>

              <td>${escapeHtml(g.descripcion)}</td>
              <td>${escapeHtml(g.categoria)}</td>
              <td>${escapeHtml(productoLabel(g.productoId))}</td>

              <td><button class="btn btn-small" data-delete-gasto="${escapeAttr(g.id)}">Eliminar</button></td>
            </tr>`).join('') : `<tr><td colspan="6" class="muted">Todavía no cargaste gastos.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function attachGastosJardinHandlers() {
  const catSelect = document.getElementById('gastoCategoria');
  catSelect.addEventListener('change', () => {
    document.getElementById('gastoNuevaCategoriaField').hidden = catSelect.value !== '__nueva__';
  });

  document.getElementById('btnAgregarGasto').addEventListener('click', () => {
    let categoria = catSelect.value;
    if (categoria === '__nueva__') {
      const nueva = document.getElementById('gastoNuevaCategoria').value.trim();
      if (!nueva) { alert('Escribí el nombre de la nueva categoría.'); return; }
      categoria = nueva;
      if (!cur().gastoCategorias.includes(nueva)) cur().gastoCategorias.push(nueva);
    }
    const descripcion = document.getElementById('gastoDescripcion').value.trim();
    const monto = Number(document.getElementById('gastoMonto').value) || 0;
    if (!descripcion || monto <= 0) { alert('Completá una descripción y un monto mayor a 0.'); return; }
    cur().gastos.push({
      id: uid('gasto'),
      fecha: document.getElementById('gastoFecha').value || todayStr(),
      descripcion,
      categoria,
      productoId: document.getElementById('gastoProducto').value,
      monto,
    });
    saveState();
    render();
  });

  document.querySelectorAll('[data-delete-gasto]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('¿Eliminar este gasto?')) return;
      cur().gastos = cur().gastos.filter(g => g.id !== btn.dataset.deleteGasto);
      saveState();
      render();
    });
  });
}

/* ===================== Exportación Excel (planilla para imprimir) ===================== */

const PLANILLA_COLS_BASE = [
  { h: 'Apellido', w: 17 }, { h: 'Nombre', w: 11 }, { h: 'Padre', w: 10 }, { h: 'Teléfono', w: 12 },
  { h: 'Madre', w: 10 }, { h: 'Teléfono', w: 12 },
  { h: 'Carpeta', w: 8 }, { h: 'Imán', w: 6 }, { h: 'Individual', w: 9.5 }, { h: 'Ind. c/ Seño', w: 7 }, { h: 'Digital', w: 7 },
  { h: 'Números de fotos', w: 17 }, { h: 'Estado de pago', w: 13 }, { h: 'Total $', w: 9.5 }, { h: 'Importe pagado', w: 9.5 }, { h: 'Saldo', w: 9.5 },
];
const PLANILLA_COLS_TURNO_SALA = [{ h: 'Turno', w: 10 }, { h: 'Sala', w: 20 }];
const PLANILLA_PRODUCTS = ['carpeta', 'iman', 'individual', 'individual_sena', 'digital'];

// porSala = true: una hoja por sala, con título arriba (turno · sala) y sin columnas Turno/Sala.
// porSala = false: todo en una sola hoja, sin título y con columnas Turno/Sala.
function planillaLayout(porSala) {
  const defs = porSala ? PLANILLA_COLS_BASE : PLANILLA_COLS_TURNO_SALA.concat(PLANILLA_COLS_BASE);
  const headerRow = porSala ? 2 : 1;
  return { defs, off: porSala ? 0 : 2, headerRow, firstData: headerRow + 1, lastCol: xlsCol(defs.length - 1) };
}

function xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function xlsCol(i) { return String.fromCharCode(65 + i); }

function xlsStr(ref, text, style) {
  if (text === '' || text == null) return `<c r="${ref}" s="${style}"/>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(text)}</t></is></c>`;
}

function xlsNum(ref, n, style) {
  if (!n) return `<c r="${ref}" s="${style}"/>`;
  return `<c r="${ref}" s="${style}"><v>${n}</v></c>`;
}

function planillaFotos(a) {
  return [...(a.fotosGrupales || []), ...(a.fotosIndividuales || [])].join(' - ');
}

function planillaSheetXml(alumnos, orientation, sheetTitle, porSala) {
  const { defs, off, headerRow, firstData, lastCol } = planillaLayout(porSala);
  const c = i => xlsCol(off + i);
  const rows = [];

  if (porSala) rows.push(`<row r="1" ht="32" customHeight="1">${xlsStr('A1', sheetTitle, 13)}</row>`);
  rows.push(`<row r="${headerRow}" ht="36" customHeight="1">${defs.map((d, i) => xlsStr(xlsCol(i) + headerRow, d.h, 1)).join('')}</row>`);

  const sums = PLANILLA_PRODUCTS.map(() => 0);
  let sumTotal = 0, sumPagado = 0, sumSaldo = 0;

  alumnos.forEach((a, idx) => {
    const r = firstData + idx;
    const total = calcTotal(a), pagado = calcCobrado(a), saldo = calcSaldo(a);
    const st = statusInfo(a);
    const estadoStyle = st.cls === 'pill-good' ? 6 : st.cls === 'pill-warn' ? 7 : st.cls === 'pill-bad' ? 8 : 3;
    const cells = [];
    if (!porSala) cells.push(xlsStr('A' + r, a.turno, 2), xlsStr('B' + r, a.sala, 2));
    cells.push(
      xlsStr(c(0) + r, a.apellido, 2), xlsStr(c(1) + r, a.nombre, 2),
      xlsStr(c(2) + r, a.padre, 2), xlsStr(c(3) + r, a.telefonoPadre, 2),
      xlsStr(c(4) + r, a.madre, 2), xlsStr(c(5) + r, a.telefonoMadre, 2)
    );
    PLANILLA_PRODUCTS.forEach((pid, i) => {
      const q = Number(a.productos[pid]) || 0;
      sums[i] += q;
      cells.push(xlsNum(c(6 + i) + r, q, 4));
    });
    const fotos = planillaFotos(a);
    cells.push(xlsStr(c(11) + r, fotos, 12));
    cells.push(xlsStr(c(12) + r, total > 0 ? st.label : '', total > 0 ? estadoStyle : 3));
    cells.push(xlsNum(c(13) + r, total, 5));
    cells.push(xlsNum(c(14) + r, pagado, 5));
    cells.push(xlsNum(c(15) + r, saldo, 5));
    sumTotal += total; sumPagado += pagado; sumSaldo += saldo;
    const lines = Math.max(1, Math.ceil(fotos.length / 15));
    const ht = Math.max(24, lines * 16 + 6);
    rows.push(`<row r="${r}" ht="${ht}" customHeight="1">${cells.join('')}</row>`);
  });

  const lastData = firstData + alumnos.length - 1;
  const tr = lastData + 1;
  const tcells = [];
  for (let i = 0; i < off + 6; i++) tcells.push(xlsStr(xlsCol(i) + tr, i === 0 ? 'TOTAL' : '', 9));
  PLANILLA_PRODUCTS.forEach((pid, i) => {
    const col = c(6 + i);
    tcells.push(`<c r="${col}${tr}" s="10"><f>SUM(${col}${firstData}:${col}${lastData})</f><v>${sums[i]}</v></c>`);
  });
  tcells.push(xlsStr(c(11) + tr, '', 9));
  tcells.push(xlsStr(c(12) + tr, '', 9));
  [[13, sumTotal], [14, sumPagado], [15, sumSaldo]].forEach(([i, v]) => {
    const col = c(i);
    tcells.push(`<c r="${col}${tr}" s="11"><f>SUM(${col}${firstData}:${col}${lastData})</f><v>${v}</v></c>`);
  });
  rows.push(`<row r="${tr}" ht="26" customHeight="1">${tcells.join('')}</row>`);

  const cols = defs.map((d, i) => `<col min="${i + 1}" max="${i + 1}" width="${d.w}" customWidth="1"/>`).join('');
  const filter = alumnos.length ? `<autoFilter ref="A${headerRow}:${lastCol}${lastData}"/>` : '';
  const merge = porSala ? `<mergeCells count="1"><mergeCell ref="A1:${lastCol}1"/></mergeCells>` : '';
  const ampEsc = s => String(s).replace(/&/g, '&&');
  const header = '&L&"-,Bold"' + ampEsc('Virginia Migueltorena Fotografía · ' + cur().nombre) + '&R' + ampEsc(sheetTitle);
  const footer = '&LImpreso el &D&RPágina &P de &N';

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${lastCol}${tr}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="${headerRow}" topLeftCell="A${headerRow + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="24" customHeight="1"/><cols>${cols}</cols><sheetData>${rows.join('')}</sheetData>${filter}${merge}<printOptions horizontalCentered="1"/><pageMargins left="0.4" right="0.4" top="0.7" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="${orientation}" fitToWidth="1" fitToHeight="0"/><headerFooter><oddHeader>${xmlEsc(header)}</oddHeader><oddFooter>${xmlEsc(footer)}</oddFooter></headerFooter></worksheet>`;
}

d="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="3" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="5" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="6" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="6" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="3" fontId="1" fillId="6" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf><xf numFmtId="49" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

const XLSX_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function xlsCrc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = XLSX_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Arma un .zip sin compresión (suficiente para un .xlsx liviano) sin depender de ninguna librería externa.
function buildZipBlob(files, mime) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  files.forEach(f => {
    const nameB = enc.encode(f.name);
    const data = enc.encode(f.data);
    const crc = xlsCrc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nameB.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + data.length;
  });
  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: mime });
}

function safeSheetName(name, used) {
  let base = String(name).replace(/[\[\]:*?\/\\']/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 31) || 'Hoja';
  let out = base, n = 2;
  while (used.has(out.toLowerCase())) {
    const suffix = ' ' + n++;
    out = base.slice(0, 31 - suffix.length) + suffix;
  }
  used.add(out.toLowerCase());
  return out;
}

function buildXlsxBlob(sheets, orientation) {
  const used = new Set();
  const named = sheets.map(sh => ({ name: safeSheetName(sh.name, used), alumnos: sh.alumnos, title: sh.title, porSala: !!sh.porSala }));
  const files = [];

  files.push({ name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${named.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` });

  files.push({ name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` });

  const defined = [];
  named.forEach((sh, i) => {
    const q = `'${sh.name}'`;
    const lay = planillaLayout(sh.porSala);
    defined.push(`<definedName name="_xlnm.Print_Titles" localSheetId="${i}">${xmlEsc(q)}!$${lay.headerRow}:$${lay.headerRow}</definedName>`);
    if (sh.alumnos.length) defined.push(`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">${xmlEsc(q)}!$A$${lay.headerRow}:$${lay.lastCol}$${lay.headerRow + sh.alumnos.length}</definedName>`);
  });

  files.push({ name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${named.map((sh, i) => `<sheet name="${xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><definedNames>${defined.join('')}</definedNames></workbook>` });

  files.push({ name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${named.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${named.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });

  files.push({ name: 'xl/styles.xml', data: PLANILLA_STYLES_XML });
  named.forEach((sh, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: planillaSheetXml(sh.alumnos, orientation, sh.title, sh.porSala) }));

  return buildZipBlob(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function planillaSheetsFor(scope, filtro) {
  const salasOrden = [];
  turnosList().forEach(t => (salasPorTurno()[t] || []).forEach(s => salasOrden.push({ turno: t, sala: s })));

  const pasaFiltro = a => filtro === 'pedido' ? calcTotal(a) > 0 : filtro === 'saldo' ? calcSaldo(a) > 0 : true;
  const deSala = (turno, sala) => cur().alumnos.filter(a => a.turno === turno && a.sala === sala && pasaFiltro(a)).sort(sortByName);

  if (scope === 'one') {
    const alumnos = [];
    salasOrden.forEach(({ turno, sala }) => alumnos.push(...deSala(turno, sala)));
    return [{ name: 'Pedidos', title: 'Todas las salas', alumnos, porSala: false }];
  }
  let lista = salasOrden;
  if (scope.startsWith('turno:')) {
    const t = scope.slice(6);
    lista = salasOrden.filter(x => x.turno === t);
  } else if (scope.startsWith('sala:')) {
    const [t, s] = scope.slice(5).split('|');
    lista = salasOrden.filter(x => x.turno === t && x.sala === s);
  }
  return lista
    .map(({ turno, sala }) => ({ name: `${turno} - ${sala}`, title: `${turno} · ${sala}`, alumnos: deSala(turno, sala), porSala: true }))
    .filter(sh => sh.alumnos.length > 0);
}

function exportPlanillaExcel(scope, filtro, orientation) {
  const sheets = planillaSheetsFor(scope, filtro);
  if (!sheets.length || sheets.every(sh => !sh.alumnos.length)) {
    alert('No hay alumnos para exportar con esa selección.');
    return;
  }
  const blob = buildXlsxBlob(sheets, orientation === 'portrait' ? 'portrait' : 'landscape');
  const label = scope === 'all' ? 'todas_las_salas' : scope === 'one' ? 'todo' : slug(scope.replace(/^(turno|sala):/, ''));
  triggerDownload(blob, `planilla_${slug(cur().nombre)}_${label}_${todayStr()}.xlsx`);
}

/* ===================== Exportación CSV ===================== */

function csvEscape(v) {
  const s = String(v ?? '');
  if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.join(';')].concat(rows.map(r => r.map(csvEscape).join(';')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  triggerDownload(blob, filename);
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function productosLista(a) {
  return PRODUCTS.filter(p => (Number(a.productos[p.id]) || 0) > 0)
    .map(p => `${p.label} x${a.productos[p.id]}`)
    .join(', ');
}

function estadoPagoLabel(a) {
  return statusInfo(a).label;
}

function medioPagoLabel(a) {
  if (!a.medioPago) return '';
  return a.medioPago === 'efectivo' ? 'Efectivo' : 'Transferencia';
}

function exportPorProducto(productId) {
  const prod = PRODUCTS.find(p => p.id === productId);
  const alumnos = cur().alumnos.filter(a => (Number(a.productos[productId]) || 0) > 0).sort(sortByName);
  const headers = ['Turno', 'Sala', 'Apellido', 'Nombre', 'Cantidad', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Estado de pago', 'Medio de pago'];
  const rows = alumnos.map(a => [a.turno, a.sala, a.apellido, a.nombre, a.productos[productId], a.padre, a.telefonoPadre, a.madre, a.telefonoMadre, estadoPagoLabel(a), medioPagoLabel(a)]);
  downloadCSV(`pedidos_${slug(cur().nombre)}_${slug(prod.label)}.csv`, headers, rows);
}

function exportPorSala(turno, sala) {
  const alumnos = cur().alumnos.filter(a => a.turno === turno && a.sala === sala).sort(sortByName);
  const headers = ['Apellido', 'Nombre', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Productos pedidos', 'Fotos grupales', 'Fotos individuales', 'Fecha de pedido', 'Estado de pago', 'Monto abonado', 'Medio de pago', 'Total', 'Saldo pendiente', 'Notas'];
  const rows = alumnos.map(a => [
    a.apellido, a.nombre, a.padre, a.telefonoPadre, a.madre, a.telefonoMadre,
    productosLista(a) || '—',
    a.fotosGrupales.join(', '), a.fotosIndividuales.join(', '), a.fecha,
    estadoPagoLabel(a), money(calcCobrado(a)), medioPagoLabel(a),
    money(calcTotal(a)), money(calcSaldo(a)), a.notas,
  ]);
  downloadCSV(`listado_${slug(cur().nombre)}_${slug(turno)}_${slug(sala)}.csv`, headers, rows);
}

function exportCompleto() {
  const alumnos = [...cur().alumnos].sort((a, b) => {
    if (a.turno !== b.turno) return a.turno.localeCompare(b.turno, 'es');
    if (a.sala !== b.sala) return a.sala.localeCompare(b.sala, 'es');
    return sortByName(a, b);
  });
  const headers = ['Turno', 'Sala', 'Apellido', 'Nombre', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Productos pedidos', 'Fotos grupales', 'Fotos individuales', 'Fecha de pedido', 'Estado de pago', 'Monto abonado', 'Medio de pago', 'Total', 'Saldo pendiente'];
  const rows = alumnos.map(a => [
    a.turno, a.sala, a.apellido, a.nombre, a.padre, a.telefonoPadre, a.madre, a.telefonoMadre,
    productosLista(a) || '—', a.fotosGrupales.join(', '), a.fotosIndividuales.join(', '), a.fecha,
    estadoPagoLabel(a), money(calcCobrado(a)), medioPagoLabel(a),
    money(calcTotal(a)), money(calcSaldo(a)),
  ]);
  downloadCSV(`listado_${slug(cur().nombre)}_completo.csv`, headers, rows);
}

function slug(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
}

/* ===================== Backup JSON ===================== */

function exportBackup() {
  state.ultimoBackup = new Date().toISOString();
  saveState();
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  triggerDownload(blob, `backup_virginia_fotografia_${todayStr()}.json`);
  if (ui.screen === 'home') render();
}

function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const nuevo = migrateState(JSON.parse(reader.result));
      const nAl = nuevo.jardines.reduce((s, j) => s + j.alumnos.length, 0);
      const ok = confirm(`Se va a reemplazar toda la información cargada por la del archivo "${file.name}": ${nuevo.jardines.length} jardines, ${nAl} alumnos, ${nuevo.sesiones.length} sesiones y ${nuevo.gastosPersonales.length} gastos personales. ¿Continuar?`);
      if (!ok) return;
      state = nuevo;
      ui.screen = 'home'; ui.jardinId = null; ui.view = 'fichas'; ui.turno = 'Mañana'; ui.sala = null; ui.search = '';
      ui.gpEditId = null; ui.sesionAbierta = null; ui.nuevoJardin = false;
      saveState();
      render();
      alert('Backup importado correctamente.');
    } catch (err) {
      alert('No se pudo importar el archivo: ' + err.message);
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
}

/* ===================== Utilidades ===================== */

function normalize(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Virginia Migueltorena Fotografía — Gestión de pedidos</title>
<style>
:root {
  --bg: #F6F3E6;
  --surface: #FFFFFF;
  --ink: #2C3A2C;
  --ink-soft: #62735F;
  --ink-faint: #99A791;
  --accent: #6F9668;
  --accent-light: #E5EFDD;
  --accent-dark: #55794F;
  --good: #55804F;
  --good-bg: #E4EFDD;
  --warn: #A9813A;
  --warn-bg: #F5EBD3;
  --bad: #AD6350;
  --bad-bg: #F4E4DC;
  --border: #E2DCC4;
  --border-soft: #ECE6D2;
  --shadow: 0 1px 2px rgba(44,58,44,0.06);
  --radius-s: 6px;
  --radius-m: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display {
  font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input, select, textarea, button {
  font-family: inherit;
  font-size: 0.95rem;
}

a { color: inherit; }

::selection { background: #CFE2C6; }

.app-shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 16px 64px;
}

/* ---------- Header ---------- */

.storage-warning {
  background: var(--warn-bg);
  color: var(--warn);
  border: 1px solid var(--warn);
  border-radius: var(--radius-s);
  padding: 10px 14px;
  font-size: 0.85rem;
  margin-top: 12px;
}

.btn-danger {
  color: var(--bad);
  border-color: var(--bad-bg);
}
.btn-danger:hover { border-color: var(--bad); background: var(--bad-bg); }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 18px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.topbar-row1 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand .display {
  font-size: 1.5rem;
  color: var(--ink);
}

.brand .tag {
  font-size: 0.8rem;
  color: var(--ink-faint);
}

.topbar-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 13px;
  border-radius: var(--radius-s);
  font-size: 0.85rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-faint); }
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

.btn-ghost {
  border-color: transparent;
  background: transparent;
}
.btn-ghost:hover { border-color: var(--border); }

.btn-small { padding: 5px 10px; font-size: 0.78rem; }

.topbar-row2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.view-toggle, .period-toggle {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 3px;
  gap: 2px;
}

.view-toggle button, .period-toggle button {
  border: none;
  background: transparent;
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
}

.view-toggle button.active, .period-toggle button.active {
  background: var(--ink);
  color: #fff;
}

.search-box {
  flex: 1;
  min-width: 180px;
  max-width: 320px;
}

.search-box input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: var(--surface);
  color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* ---------- Turno + sala chips ---------- */

.turno-toggle {
  display: inline-flex;
  gap: 6px;
}

.turno-toggle button {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 7px 16px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.turno-toggle button.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.sala-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  margin-bottom: 4px;
}

.sala-chip {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-s);
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 108px;
}

.sala-chip .n {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--ink-faint);
}

.sala-chip.active {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent-dark);
}
.sala-chip.active .n { color: var(--accent-dark); }

.section-hint {
  color: var(--ink-faint);
  font-size: 0.9rem;
  padding: 24px 4px;
  text-align: center;
}

/* ---------- Alumno cards ---------- */

.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.list-toolbar {
  display: flex;
  justify-content: flex-end;
}

.card-footer-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
}

.alumno-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.alumno-card > summary {
  list-style: none;
  cursor: pointer;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.alumno-card > summary::-webkit-details-marker { display: none; }

.alumno-name {
  font-weight: 700;
  font-size: 0.98rem;
}
.alumno-sub {
  font-size: 0.78rem;
  color: var(--ink-faint);
  font-weight: 500;
}

.summary-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.pill {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill-good { background: var(--good-bg); color: var(--good); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-neutral { background: #EEEBF5; color: var(--ink-faint); }

.summary-total {
  font-weight: 700;
  font-size: 0.92rem;
  min-width: 78px;
  text-align: right;
}

.chev {
  color: var(--ink-faint);
  transition: transform .15s;
  flex-shrink: 0;
}
.alumno-card[open] .chev { transform: rotate(90deg); }

.card-body {
  padding: 4px 16px 18px;
  border-top: 1px solid var(--border-soft);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px 14px;
  margin: 14px 0;
}

.field label {
  display: block;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 4px;
}

.field input[type=text], .field input[type=tel], .field input[type=number], .field select, .field textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: #FEFDFA;
  color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}

.foto-field { grid-column: span 1; }
.foto-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
  min-height: 26px;
}
.foto-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--accent-light);
  color: var(--accent-dark);
  border-radius: 999px;
  padding: 3px 6px 3px 10px;
  font-size: 0.8rem;
  font-weight: 600;
}
.foto-chip button {
  border: none;
  background: transparent;
  color: var(--accent-dark);
  font-size: 0.95rem;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 999px;
}
.foto-chip button:hover { background: rgba(0,0,0,0.08); }
.foto-empty { font-size: 0.78rem; }
.foto-add-row {
  display: flex;
  gap: 6px;
}
.foto-add-row input {
  flex: 1;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: #FEFDFA;
}

.field-group-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 16px 0 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
}
.field-group-title:first-of-type { border-top: none; padding-top: 0; margin-top: 6px; }

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}

.product-check {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 8px 8px 8px 10px;
  background: #FEFDFA;
  font-size: 0.85rem;
  transition: border-color .15s, background .15s;
}
.product-check.active {
  border-color: var(--accent);
  background: var(--accent-light);
}
.product-info {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.product-label { font-weight: 600; }
.product-check .p-price { color: var(--ink-faint); font-size: 0.76rem; }

.qty-stepper {
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  overflow: hidden;
}
.qty-btn {
  border: none;
  background: transparent;
  width: 28px;
  height: 28px;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink-soft);
  line-height: 1;
}
.qty-btn:active { background: var(--border-soft); }
.qty-value {
  min-width: 22px;
  text-align: center;
  font-weight: 700;
  font-size: 0.88rem;
}

.payment-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: flex-end;
  margin-top: 6px;
}

.totales-line {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 0.84rem;
  color: var(--ink-soft);
  margin-top: 4px;
}
.totales-line b { color: var(--ink); }

/* ---------- Stats view ---------- */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-s);
  padding: 14px 16px;
}
.kpi-card .label {
  font-size: 0.76rem;
  color: var(--ink-faint);
  font-weight: 600;
  margin-bottom: 6px;
}
.kpi-card .value {
  font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  font-size: 1.5rem;
  font-weight: 600;
}

.stats-section {
  margin-bottom: 28px;
}

.stats-section h2 {
  font-size: 1.05rem;
  margin-bottom: 10px;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  overflow: hidden;
  font-size: 0.88rem;
}

table.data-table th, table.data-table td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-soft);
}

table.data-table th {
  font-size: 0.74rem;
  text-transform: none;
  color: var(--ink-faint);
  font-weight: 700;
  background: #FBF8EF;
}

table.data-table td.num, table.data-table th.num { text-align: right; }
table.data-table tr:last-child td { border-bottom: none; }

.export-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.export-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.export-row select {
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  background: #FEFDFA;
  min-width: 180px;
}

.muted { color: var(--ink-faint); font-size: 0.82rem; }

@media (max-width: 560px) {
  .app-shell { padding: 0 12px 48px; }
  .summary-total { min-width: 60px; font-size: 0.85rem; }
  .field-grid { grid-template-columns: 1fr 1fr; }
}

</style>
</head>

function defaultAlumnoFields() {
  return {
    padre: '', madre: '', telefonoPadre: '', telefonoMadre: '',
    productos: Object.fromEntries(PRODUCTS.map(p => [p.id, 0])),   // cantidad pedida de cada producto
    fotosGrupales: [], fotosIndividuales: [],
    fecha: '',
    estadoPago: 'no_pagado',   // 'pagado' | 'sena' | 'no_pagado'
    montoAbonado: 0,
    medioPago: '',
    notas: '',
  };
}

function buildInitialState() {
  return {
    version: 3,
    alumnos: ROSTER.map(r => Object.assign({ id: r.id, turno: r.turno, sala: r.sala, apellido: r.apellido, nombre: r.nombre }, defaultAlumnoFields())),
    gastos: [],
    gastoCategorias: [...GASTOS_CATEGORIAS_DEFAULT],
  };
}

// Lleva datos guardados con formatos anteriores (teléfono único, foto como texto suelto, productos como sí/no) al formato actual.
function migrateAlumno(a) {
  const base = defaultAlumnoFields();
  const out = Object.assign({}, base, a);
  if (!('telefonoPadre' in a) && 'telefono' in a) {
    out.telefonoPadre = a.telefono || '';
    out.telefonoMadre = '';
  }
  if (!Array.isArray(out.fotosGrupales)) out.fotosGrupales = a.fotoGrupal ? [String(a.fotoGrupal)] : [];
  if (!Array.isArray(out.fotosIndividuales)) out.fotosIndividuales = a.fotoIndividual ? [String(a.fotoIndividual)] : [];
  const rawProductos = a.productos || {};
  const productos = {};
  PRODUCTS.forEach(p => {
    const v = rawProductos[p.id];
    if (typeof v === 'boolean') productos[p.id] = v ? 1 : 0;
    else productos[p.id] = Math.max(0, Math.round(Number(v)) || 0);
  });
  out.productos = productos;
  delete out.telefono;
  delete out.fotoGrupal;
  delete out.fotoIndividual;
  return out;
}

let storageBlocked = false;
const memoryFallback = {};

function safeGetItem(key) {
  try { return localStorage.getItem(key); }
  catch (e) { storageBlocked = true; return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? memoryFallback[key] : null; }
}

function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); }
  catch (e) { storageBlocked = true; memoryFallback[key] = value; }
}

function loadState() {
  const raw = safeGetItem(STORAGE_KEY);
  if (!raw) {
    state = buildInitialState();
    saveState();
    return;
  }
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.alumnos)) throw new Error('formato inválido');
    parsed.alumnos = parsed.alumnos.map(migrateAlumno);
    if (!Array.isArray(parsed.gastos)) parsed.gastos = [];
    if (!Array.isArray(parsed.gastoCategorias) || !parsed.gastoCategorias.length) parsed.gastoCategorias = [...GASTOS_CATEGORIAS_DEFAULT];
    state = parsed;
    saveState();
  } catch (e) {
    console.error('No se pudo leer los datos guardados, se reinicia con el listado base.', e);
    state = buildInitialState();
    saveState();
  }
}

function saveState() {
  safeSetItem(STORAGE_KEY, JSON.stringify(state));
}

/* ===================== Cálculos ===================== */

function calcTotal(alumno) {
  return PRODUCTS.reduce((sum, p) => sum + (Number(alumno.productos[p.id]) || 0) * p.price, 0);
}

function calcCobrado(alumno) {
  const total = calcTotal(alumno);
  if (alumno.estadoPago === 'pagado') return total;
  if (alumno.estadoPago === 'sena') return Math.min(Number(alumno.montoAbonado) || 0, total);
  return 0;
}

function calcSaldo(alumno) {
  return calcTotal(alumno) - calcCobrado(alumno);
}

function statusInfo(alumno) {
  const total = calcTotal(alumno);
  if (total === 0) return { label: 'Sin pedido', cls: 'pill-neutral' };
  if (alumno.estadoPago === 'pagado') return { label: 'Pagó', cls: 'pill-good' };
  if (alumno.estadoPago === 'sena') return { label: 'Seña / parcial', cls: 'pill-warn' };
  return { label: 'No pagó', cls: 'pill-bad' };
}

function money(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function parseLocalDate(d) {
  if (!d) return null;
  const parts = String(d).split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function getWeekInfo(dateStr) {
  const d = parseLocalDate(dateStr);
  if (!d) return { key: 'zzz-sin-fecha', label: 'Sin fecha' };
  const dow = (d.getDay() + 6) % 7; // lunes = 0
  const monday = new Date(d); monday.setDate(d.getDate() - dow);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = dt => `${pad2(dt.getDate())}/${pad2(dt.getMonth() + 1)}`;
  const key = `${monday.getFullYear()}-${pad2(monday.getMonth() + 1)}-${pad2(monday.getDate())}`;
  return { key, label: `Semana del ${fmt(monday)} al ${fmt(sunday)}` };
}

function getQuincenaInfo(dateStr) {
  const d = parseLocalDate(dateStr);
  if (!d) return { key: 'zzz-sin-fecha', label: 'Sin fecha' };
  const half = d.getDate() <= 15 ? 1 : 2;
  const key = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${half}`;
  const label = half === 1 ? `1 al 15 de ${MESES[d.getMonth()]} ${d.getFullYear()}` : `16 a fin de ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  return { key, label };
}

function getMonthInfo(dateStr) {
  const d = parseLocalDate(dateStr);
  if (!d) return { key: 'zzz-sin-fecha', label: 'Sin fecha' };
  const key = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  return { key, label: `${MESES[d.getMonth()][0].toUpperCase()}${MESES[d.getMonth()].slice(1)} ${d.getFullYear()}` };
}

function periodInfoFn(periodo) {
  if (periodo === 'mes') return getMonthInfo;
  if (periodo === 'quincena') return getQuincenaInfo;
  return getWeekInfo;
}

function aggregateByPeriod(alumnosConPedido, periodo) {
  const infoFn = periodInfoFn(periodo);
  const map = new Map();
  alumnosConPedido.forEach(a => {
    const info = infoFn(a.fecha);
    if (!map.has(info.key)) map.set(info.key, { key: info.key, label: info.label, monto: 0, pedidos: 0 });
    const bucket = map.get(info.key);
    bucket.monto += calcTotal(a);
    bucket.pedidos += 1;
  });
  return Array.from(map.values()).sort((a, b) => a.key.localeCompare(b.key));
}

function productoLabel(id) {
  if (id === 'general' || !id) return 'General / sin producto';
  const p = PRODUCTS.find(p => p.id === id);
  return p ? p.label : id;
}

/* ===================== Vista: Fichas ===================== */

function renderFichas() {
  let listHtml;
  let headerExtra = '';

  if (ui.search.trim()) {
    const rawTerm = ui.search.trim();
    const term = normalize(rawTerm);
    const matches = state.alumnos
      .filter(a => normalize(a.apellido + ' ' + a.nombre).includes(term)
        || a.fotosGrupales.some(f => String(f).includes(rawTerm))
        || a.fotosIndividuales.some(f => String(f).includes(rawTerm)))
      .sort(sortByName);
    listHtml = matches.length
      ? renderCardList(matches, true)
      : `<div class="section-hint">No se encontraron alumnos para "${escapeHtml(ui.search)}".</div>`;
  } else {
    headerExtra = `
      <div class="turno-toggle">
        ${TURNOS.map(t => `<button data-turno="${escapeAttr(t)}" class="${ui.turno === t ? 'active' : ''}">${escapeHtml(t)}</button>`).join('')}
      </div>
      <div class="sala-chips">
        ${(SALAS_POR_TURNO[ui.turno] || []).map(s => {
          const alumnosSala = state.alumnos.filter(a => a.turno === ui.turno && a.sala === s);
          const pedidos = alumnosSala.filter(a => calcTotal(a) > 0).length;
          return `<button class="sala-chip ${ui.sala === s ? 'active' : ''}" data-sala="${escapeAttr(s)}">
            <span>${escapeHtml(s)}</span>
            <span class="n">${alumnosSala.length} alumnos · ${pedidos} pedidos</span>
          </button>`;
        }).join('')}
      </div>
    `;
    if (!ui.sala || !(SALAS_POR_TURNO[ui.turno] || []).includes(ui.sala)) {
      listHtml = `<div class="section-hint">Elegí una sala arriba para ver y cargar los pedidos.</div>`;
    } else {
      const alumnosSala = state.alumnos.filter(a => a.turno === ui.turno && a.sala === ui.sala).sort(sortByName);
      listHtml = `
        <div class="list-toolbar">
          <button class="btn btn-primary btn-small" id="btnAgregarAlumno">+ Agregar alumno a esta sala</button>
        </div>
        ${renderCardList(alumnosSala, false)}
      `;
    }
  }

  return `${headerExtra}<div class="card-list" id="cardList">${listHtml}</div>`;
}

function sortByName(a, b) {
  return (a.apellido + a.nombre).localeCompare(b.apellido + b.nombre, 'es');
}

function renderCardList(alumnos, showSalaTag) {
  return alumnos.map(a => renderCard(a, showSalaTag)).join('');
}

function renderCard(a, showSalaTag) {
  const total = calcTotal(a);
  const saldo = calcSaldo(a);
  const st = statusInfo(a);
  return `
    <details class="alumno-card" data-id="${escapeAttr(a.id)}">
      <summary>
        <div>
          <div class="alumno-name">${escapeHtml(a.apellido)}, ${escapeHtml(a.nombre)}</div>
          <div class="alumno-sub">${showSalaTag ? escapeHtml(a.turno) + ' · ' + escapeHtml(a.sala) : escapeHtml(a.turno)}</div>
        </div>
        <div class="summary-right">
          <span class="pill ${st.cls}" data-role="pill">${st.label}</span>
          <span class="summary-total" data-role="total">${total > 0 ? money(total) : '—'}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </summary>
      <div class="card-body">
        <div class="field-group-title">Datos del alumno</div>
        <div class="field-grid">
          <div class="field"><label>Apellido</label><input type="text" data-field="apellido" value="${escapeAttr(a.apellido)}"></div>
          <div class="field"><label>Nombre</label><input type="text" data-field="nombre" value="${escapeAttr(a.nombre)}"></div>
        </div>

        <div class="field-group-title">Contacto</div>
        <div class="field-grid">
          <div class="field"><label>Padre</label><input type="text" data-field="padre" value="${escapeAttr(a.padre)}"></div>
          <div class="field"><label>Teléfono del padre</label><input type="tel" data-field="telefonoPadre" value="${escapeAttr(a.telefonoPadre)}"></div>
          <div class="field"><label>Madre</label><input type="text" data-field="madre" value="${escapeAttr(a.madre)}"></div>
          <div class="field"><label>Teléfono de la madre</label><input type="tel" data-field="telefonoMadre" value="${escapeAttr(a.telefonoMadre)}"></div>
        </div>

        <div class="field-group-title">Pedido</div>
        <div class="products-grid">
          ${PRODUCTS.map(p => renderProductRow(a, p)).join('')}
        </div>
        <div class="field-grid" style="margin-top:12px">
          <div class="field foto-field">
            <label>Fotos grupales</label>
            <div class="foto-chips" data-foto-type="grupal">${renderFotoChipsHtml(a.fotosGrupales, 'grupal')}</div>
            <div class="foto-add-row">
              <input type="text" inputmode="numeric" placeholder="N° de foto" data-foto-input="grupal">
              <button type="button" class="btn btn-small" data-add-foto="grupal">Agregar</button>
            </div>
          </div>
          <div class="field foto-field">
            <label>Fotos individuales</label>
            <div class="foto-chips" data-foto-type="individual">${renderFotoChipsHtml(a.fotosIndividuales, 'individual')}</div>
            <div class="foto-add-row">
              <input type="text" inputmode="numeric" placeholder="N° de foto" data-foto-input="individual">
              <button type="button" class="btn btn-small" data-add-foto="individual">Agregar</button>
            </div>
          </div>
        </div>

        <div class="field-group-title">Pago</div>
        <div class="payment-row">
          <div class="field" style="min-width:150px">
            <label>Estado</label>
            <select data-field="estadoPago">
              <option value="no_pagado" ${a.estadoPago === 'no_pagado' ? 'selected' : ''}>No pagó</option>
              <option value="sena" ${a.estadoPago === 'sena' ? 'selected' : ''}>Seña / pago parcial</option>
              <option value="pagado" ${a.estadoPago === 'pagado' ? 'selected' : ''}>Pagó completo</option>
            </select>
          </div>
          <div class="field" style="min-width:130px" data-role="montoAbonadoField" ${a.estadoPago === 'sena' ? '' : 'hidden'}>
            <label>Monto abonado</label>
            <input type="number" min="0" step="500" data-field="montoAbonado" value="${Number(a.montoAbonado) || 0}">
          </div>
          <div class="field" style="min-width:150px">
            <label>Medio de pago</label>
            <select data-field="medioPago">
              <option value="" ${a.medioPago === '' ? 'selected' : ''}>—</option>
              <option value="efectivo" ${a.medioPago === 'efectivo' ? 'selected' : ''}>Efectivo</option>
              <option value="transferencia" ${a.medioPago === 'transferencia' ? 'selected' : ''}>Transferencia</option>
            </select>
          </div>
          <div class="field" style="min-width:150px">
            <label>Fecha del pedido</label>
            <input type="date" data-field="fecha" value="${escapeAttr(a.fecha)}">
          </div>
        </div>
        <div class="totales-line">
          <span>Total pedido: <b data-role="totalLine">${money(total)}</b></span>
          <span>Cobrado: <b data-role="cobradoLine">${money(calcCobrado(a))}</b></span>
          <span>Saldo pendiente: <b data-role="saldoLine">${money(saldo)}</b></span>
        </div>

        <div class="field-group-title">Notas</div>
        <div class="field"><textarea rows="2" data-field="notas" placeholder="Opcional">${escapeHtml(a.notas)}</textarea></div>

        <div class="card-footer-actions">
          <button type="button" class="btn btn-small btn-danger" data-delete-alumno="${escapeAttr(a.id)}">Eliminar alumno de la lista</button>
        </div>
      </div>
    </details>
  `;
}

function renderProductRow(a, p) {
  const qty = Number(a.productos[p.id]) || 0;
  return `
    <div class="product-check ${qty > 0 ? 'active' : ''}" data-product-row="${p.id}">
      <span class="product-info">
        <span class="product-label">${p.label}</span>
        <span class="p-price">${money(p.price)}</span>
      </span>
      <div class="qty-stepper" data-product="${p.id}">
        <button type="button" class="qty-btn" data-qty-action="dec" aria-label="Restar">−</button>
        <span class="qty-value" data-role="qtyValue">${qty}</span>
        <button type="button" class="qty-btn" data-qty-action="inc" aria-label="Sumar">+</button>
      </div>
    </div>
  `;
}

function renderFotoChipsHtml(arr, tipo) {
  if (!arr.length) return '<span class="muted foto-empty">Sin fotos cargadas</span>';
  return arr.map(f => `<span class="foto-chip">${escapeHtml(f)}<button type="button" data-remove-foto="${tipo}" data-value="${escapeAttr(f)}" aria-label="Quitar">×</button></span>`).join('');
}

function attachFichasHandlers() {
  attachTurnoSalaAndListHandlers();
  wireSearchInputOnce();
}

function attachTurnoSalaAndListHandlers() {
  document.querySelectorAll('.turno-toggle button').forEach(btn => {
    btn.addEventListener('click', () => { ui.turno = btn.dataset.turno; ui.sala = null; render(); });
  });
  document.querySelectorAll('.sala-chip').forEach(btn => {
    btn.addEventListener('click', () => { ui.sala = btn.dataset.sala; render(); });
  });
  attachCardListHandlers();
}

// The search input lives in the topbar, which stays untouched during search-only re-renders,
// so this node can persist across many renders. Guard with a flag to avoid stacking a new
// "input" listener on it every keystroke (which previously caused runaway re-renders).
function wireSearchInputOnce() {
  const searchInput = document.getElementById('searchInput');
  if (!searchInput || searchInput.dataset.wired) return;
  searchInput.dataset.wired = '1';
  searchInput.addEventListener('input', () => { ui.search = searchInput.value; renderSearchOnly(); });
}

function attachCardListHandlers() {
  const list = document.getElementById('cardList');
  if (!list) return;
  list.addEventListener('input', onFieldChange);
  list.addEventListener('change', onFieldChange);
  list.addEventListener('click', onFotoClick);
  list.addEventListener('click', onQtyClick);
  list.addEventListener('click', onAgregarAlumnoClick);
  list.addEventListener('click', onEliminarAlumnoClick);
  list.addEventListener('keydown', onFotoKeydown);
}

function onAgregarAlumnoClick(e) {
  const btn = e.target.closest('#btnAgregarAlumno');
  if (!btn) return;
  const nuevo = Object.assign(
    { id: uid('al'), turno: ui.turno, sala: ui.sala, apellido: 'Apellido', nombre: 'Nombre' },
    defaultAlumnoFields()
  );
  state.alumnos.push(nuevo);
  saveState();
  render();
  const cardEl = document.querySelector(`.alumno-card[data-id="${nuevo.id}"]`);
  if (cardEl) {
    cardEl.setAttribute('open', '');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const apellidoInput = cardEl.querySelector('[data-field="apellido"]');
    if (apellidoInput) { apellidoInput.focus(); apellidoInput.select(); }
  }
}

function onEliminarAlumnoClick(e) {
  const btn = e.target.closest('[data-delete-alumno]');
  if (!btn) return;
  const alumno = state.alumnos.find(a => a.id === btn.dataset.deleteAlumno);
  if (!alumno) return;
  const ok = confirm(`¿Eliminar a ${alumno.apellido}, ${alumno.nombre} de la lista? No se puede deshacer.`);
  if (!ok) return;
  state.alumnos = state.alumnos.filter(a => a.id !== alumno.id);
  saveState();
  render();
}

function onQtyClick(e) {
  const btn = e.target.closest('[data-qty-action]');
  if (!btn) return;
  const cardEl = e.target.closest('.alumno-card');
  const alumno = state.alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  const productId = btn.closest('.qty-stepper').dataset.product;
  const current = Number(alumno.productos[productId]) || 0;
  const next = btn.dataset.qtyAction === 'inc' ? current + 1 : Math.max(0, current - 1);
  alumno.productos[productId] = next;
  saveState();

  const row = cardEl.querySelector(`[data-product-row="${productId}"]`);
  row.querySelector('[data-role="qtyValue"]').textContent = next;
  row.classList.toggle('active', next > 0);
  updateCardComputed(cardEl, alumno);
  updateSalaChipCounts();
}

function onFotoClick(e) {
  const addBtn = e.target.closest('[data-add-foto]');
  const removeBtn = e.target.closest('[data-remove-foto]');
  if (!addBtn && !removeBtn) return;
  const cardEl = e.target.closest('.alumno-card');
  const alumno = state.alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  if (addBtn) addFotoFromCard(cardEl, alumno, addBtn.dataset.addFoto);
  if (removeBtn) removeFoto(cardEl, alumno, removeBtn.dataset.removeFoto, removeBtn.dataset.value);
}

function onFotoKeydown(e) {
  if (e.key !== 'Enter') return;
  const input = e.target.closest('[data-foto-input]');
  if (!input) return;
  e.preventDefault();
  const cardEl = e.target.closest('.alumno-card');
  const alumno = state.alumnos.find(a => a.id === cardEl.dataset.id);
  if (!alumno) return;
  addFotoFromCard(cardEl, alumno, input.dataset.fotoInput);
}

function addFotoFromCard(cardEl, alumno, tipo) {
  const input = cardEl.querySelector(`[data-foto-input="${tipo}"]`);
  const val = input.value.trim();
  if (!val) return;
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  if (!arr.includes(val)) arr.push(val);
  input.value = '';
  saveState();
  refreshFotoChips(cardEl, alumno, tipo);
  input.focus();
}

function removeFoto(cardEl, alumno, tipo, value) {
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  const idx = arr.indexOf(value);
  if (idx > -1) arr.splice(idx, 1);
  saveState();
  refreshFotoChips(cardEl, alumno, tipo);
}

function refreshFotoChips(cardEl, alumno, tipo) {
  const arr = tipo === 'grupal' ? alumno.fotosGrupales : alumno.fotosIndividuales;
  const container = cardEl.querySelector(`.foto-chips[data-foto-type="${tipo}"]`);
  if (container) container.innerHTML = renderFotoChipsHtml(arr, tipo);
}

// Re-render only the list + chips on search keystrokes, keep focus in the search box.
function renderSearchOnly() {
  const viewport = document.getElementById('viewport');
  const caretPos = document.getElementById('searchInput') ? document.getElementById('searchInput').selectionStart : null;
  viewport.innerHTML = renderFichas();
  attachTurnoSalaAndListHandlers();
  wireSearchInputOnce();
  const input = document.getElementById('searchInput');
  if (input) {
    input.focus();
    if (caretPos !== null) input.setSelectionRange(caretPos, caretPos);
  }
}

function onFieldChange(e) {
  const cardEl = e.target.closest('.alumno-card');
  if (!cardEl) return;
  const id = cardEl.dataset.id;
  const alumno = state.alumnos.find(a => a.id === id);
  if (!alumno) return;

  if (e.target.dataset.field) {
    const field = e.target.dataset.field;
    if (field === 'montoAbonado') {
      alumno[field] = Number(e.target.value) || 0;
    } else {
      alumno[field] = e.target.value;
    }
    if (field === 'estadoPago') {
      const montoField = cardEl.querySelector('[data-role="montoAbonadoField"]');
      if (montoField) montoField.hidden = (e.target.value !== 'sena');
    }
    if (field === 'apellido' || field === 'nombre') {
      const nameEl = cardEl.querySelector('.alumno-name');
      if (nameEl) nameEl.textContent = `${alumno.apellido}, ${alumno.nombre}`;
    }
  } else {
    return;
  }

  if (e.type === 'input') {
    saveStateDebounced();
  } else {
    saveState();
  }
  updateCardComputed(cardEl, alumno);
  updateSalaChipCounts();
}

let saveTimer = null;
function saveStateDebounced() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}

function updateCardComputed(cardEl, alumno) {
  const total = calcTotal(alumno);
  const cobrado = calcCobrado(alumno);
  const saldo = calcSaldo(alumno);
  const st = statusInfo(alumno);

  const pillEl = cardEl.querySelector('[data-role="pill"]');
  pillEl.textContent = st.label;
  pillEl.className = 'pill ' + st.cls;

  cardEl.querySelector('[data-role="total"]').textContent = total > 0 ? money(total) : '—';
  cardEl.querySelector('[data-role="totalLine"]').textContent = money(total);
  cardEl.querySelector('[data-role="cobradoLine"]').textContent = money(cobrado);
  cardEl.querySelector('[data-role="saldoLine"]').textContent = money(saldo);
}

function updateSalaChipCounts() {
  document.querySelectorAll('.sala-chip').forEach(chip => {
    const sala = chip.dataset.sala;
    const alumnosSala = state.alumnos.filter(a => a.turno === ui.turno && a.sala === sala);
    const pedidos = alumnosSala.filter(a => calcTotal(a) > 0).length;
    const nEl = chip.querySelector('.n');
    if (nEl) nEl.textContent = `${alumnosSala.length} alumnos · ${pedidos} pedidos`;
  });
}

/* ===================== Vista: Estadísticas ===================== */

function renderStats() {
  const alumnosConPedido = state.alumnos.filter(a => calcTotal(a) > 0);
  const totalVentas = alumnosConPedido.reduce((s, a) => s + calcTotal(a), 0);
  const totalCobrado = state.alumnos.reduce((s, a) => s + calcCobrado(a), 0);
  const totalPendiente = totalVentas - totalCobrado;

  const porProducto = PRODUCTS.map(p => {
    const pedidos = state.alumnos.filter(a => (Number(a.productos[p.id]) || 0) > 0).length;
    const cantidad = state.alumnos.reduce((s, a) => s + (Number(a.productos[p.id]) || 0), 0);
    return { ...p, pedidos, cantidad, monto: cantidad * p.price };
  });

  const salasOrden = [];
  TURNOS.forEach(t => (SALAS_POR_TURNO[t] || []).forEach(s => salasOrden.push({ turno: t, sala: s })));
  const porSala = salasOrden.map(({ turno, sala }) => {
    const alumnosSala = state.alumnos.filter(a => a.turno === turno && a.sala === sala);
    const conPedido = alumnosSala.filter(a => calcTotal(a) > 0);
    return {
      turno, sala,
      totalAlumnos: alumnosSala.length,
      pedidos: conPedido.length,
      monto: conPedido.reduce((s, a) => s + calcTotal(a), 0),
    };
  });

  const periodos = aggregateByPeriod(alumnosConPedido, ui.periodo);

  const totalGastos = state.gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const balance = totalVentas - totalGastos;
  const gastosPorProducto = Object.fromEntries(PRODUCTS.map(p => [p.id, 0]));
  let gastosGenerales = 0;
  state.gastos.forEach(g => {
    if (gastosPorProducto.hasOwnProperty(g.productoId)) gastosPorProducto[g.productoId] += Number(g.monto) || 0;
    else gastosGenerales += Number(g.monto) || 0;
  });
  const margenPorProducto = porProducto.map(p => {
    const gasto = gastosPorProducto[p.id] || 0;
    const margen = p.monto - gasto;
    const margenPct = p.monto > 0 ? (margen / p.monto * 100) : null;
    return { ...p, gasto, margen, margenPct };
  });

  return `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Monto total vendido</div><div class="value">${money(totalVentas)}</div></div>
      <div class="kpi-card"><div class="label">Cobrado hasta ahora</div><div class="value">${money(totalCobrado)}</div></div>
      <div class="kpi-card"><div class="label">Pendiente de cobro</div><div class="value">${money(totalPendiente)}</div></div>
      <div class="kpi-card"><div class="label">Pedidos con al menos 1 producto</div><div class="value">${alumnosConPedido.length} <span style="font-size:0.9rem;color:var(--ink-faint)">/ ${state.alumnos.length}</span></div></div>
    </div>

    <div class="stats-section">
      <h2>Ventas por producto</h2>
      <table class="data-table">
        <thead><tr><th>Producto</th><th class="num">Pedidos</th><th class="num">Cantidad vendida</th><th class="num">Precio</th><th class="num">Monto total</th></tr></thead>
        <tbody>
          ${porProducto.map(p => `<tr><td>${p.label}</td><td class="num">${p.pedidos}</td><td class="num">${p.cantidad}</td><td class="num">${money(p.price)}</td><td class="num">${money(p.monto)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Pedidos y ventas por sala</h2>
      <table class="data-table">
        <thead><tr><th>Turno</th><th>Sala</th><th class="num">Alumnos</th><th class="num">Pedidos</th><th class="num">Monto</th></tr></thead>
        <tbody>
          ${porSala.map(s => `<tr><td>${escapeHtml(s.turno)}</td><td>${escapeHtml(s.sala)}</td><td class="num">${s.totalAlumnos}</td><td class="num">${s.pedidos}</td><td class="num">${money(s.monto)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Ventas por período</h2>
      <div class="period-toggle" style="margin-bottom:10px">
        <button data-periodo="semana" class="${ui.periodo === 'semana' ? 'active' : ''}">Semana</button>
        <button data-periodo="quincena" class="${ui.periodo === 'quincena' ? 'active' : ''}">Quincena</button>
        <button data-periodo="mes" class="${ui.periodo === 'mes' ? 'active' : ''}">Mes</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Período</th><th class="num">Pedidos</th><th class="num">Monto vendido</th></tr></thead>
        <tbody>
          ${periodos.length ? periodos.map(p => `<tr><td>${escapeHtml(p.label)}</td><td class="num">${p.pedidos}</td><td class="num">${money(p.monto)}</td></tr>`).join('') : `<tr><td colspan="3" class="muted">Todavía no hay pedidos cargados.</td></tr>`}
        </tbody>
      </table>
      <div class="muted" style="margin-top:8px">Se agrupa según la "Fecha del pedido" cargada en cada ficha. Los pedidos sin fecha aparecen como "Sin fecha".</div>
    </div>

    <div class="stats-section">
      <h2>Balance del negocio</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="label">Ingresos (ventas)</div><div class="value">${money(totalVentas)}</div></div>
        <div class="kpi-card"><div class="label">Gastos totales</div><div class="value">${money(totalGastos)}</div></div>
        <div class="kpi-card"><div class="label">Balance</div><div class="value" style="color:${balance >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(balance)}</div></div>
      </div>
      <h2 style="margin-top:18px">Margen por producto</h2>
      <table class="data-table">
        <thead><tr><th>Producto</th><th class="num">Ventas</th><th class="num">Gastos asignados</th><th class="num">Margen</th><th class="num">Margen %</th></tr></thead>
        <tbody>
          ${margenPorProducto.map(p => `<tr><td>${p.label}</td><td class="num">${money(p.monto)}</td><td class="num">${money(p.gasto)}</td><td class="num">${money(p.margen)}</td><td class="num">${p.margenPct === null ? '—' : p.margenPct.toFixed(0) + '%'}</td></tr>`).join('')}
          ${gastosGenerales > 0 ? `<tr><td><i>General / sin producto asignado</i></td><td class="num">—</td><td class="num">${money(gastosGenerales)}</td><td class="num">—</td><td class="num">—</td></tr>` : ''}
        </tbody>
      </table>
      <div class="muted" style="margin-top:8px">Margen = ventas del producto menos los gastos que le asignaste en la sección Gastos. Los gastos "generales" se descuentan del balance total pero no afectan el margen de un producto puntual.</div>
    </div>

    <div class="stats-section">
      <h2>Exportar listados</h2>
      <div class="export-panel">
        <div class="export-row">
          <select id="exportProductoSelect">
            ${PRODUCTS.map(p => `<option value="${p.id}">${p.label}</option>`).join('')}
          </select>
          <button class="btn" id="btnExportProducto">Exportar por producto (CSV)</button>
        </div>
        <div class="export-row">
          <select id="exportSalaSelect">
            ${salasOrden.map(({ turno, sala }) => `<option value="${escapeAttr(turno)}|${escapeAttr(sala)}">${turno} · ${sala}</option>`).join('')}
          </select>
          <button class="btn" id="btnExportSala">Exportar por sala (CSV)</button>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="btnExportTodo">Exportar listado completo (CSV)</button>
        </div>
        <div class="muted">Los CSV se abren directamente en Excel. El backup en JSON (botón de arriba) es para pasar todos los datos cargados a otra computadora o celular.</div>
      </div>
    </div>
  `;
}

function attachStatsHandlers() {
  document.getElementById('btnExportProducto').addEventListener('click', () => {
    const pid = document.getElementById('exportProductoSelect').value;
    exportPorProducto(pid);
  });
  document.getElementById('btnExportSala').addEventListener('click', () => {
    const [turno, sala] = document.getElementById('exportSalaSelect').value.split('|');
    exportPorSala(turno, sala);
  });
  document.getElementById('btnExportTodo').addEventListener('click', exportCompleto);
  document.querySelectorAll('[data-periodo]').forEach(btn => {
    btn.addEventListener('click', () => { ui.periodo = btn.dataset.periodo; render(); });
  });
}

/* ===================== Vista: Gastos ===================== */

function renderGastos() {
  const gastosOrdenados = [...state.gastos].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  const totalGastos = state.gastos.reduce((s, g) => s + (Number(g.monto) || 0), 0);

  return `
    <div class="stats-section">
      <h2>Registrar gasto</h2>
      <div class="export-panel">
        <div class="field-grid" style="margin:0">
          <div class="field"><label>Fecha</label><input type="date" id="gastoFecha" value="${todayStr()}"></div>
          <div class="field"><label>Descripción</label><input type="text" id="gastoDescripcion" placeholder="Ej: compra de 20 carpetas"></div>
          <div class="field">
            <label>Categoría</label>
            <select id="gastoCategoria">
              ${state.gastoCategorias.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}
              <option value="__nueva__">+ Nueva categoría…</option>
            </select>
          </div>
          <div class="field" id="gastoNuevaCategoriaField" hidden>
            <label>Nombre de la categoría nueva</label>
            <input type="text" id="gastoNuevaCategoria" placeholder="Ej: Alquiler de sala">
          </div>
          <div class="field">
            <label>Impacta en el producto</label>
            <select id="gastoProducto">
              <option value="general">General / sin producto específico</option>
              ${PRODUCTS.map(p => `<option value="${p.id}">${p.label}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Monto</label><input type="number" min="0" step="100" id="gastoMonto" value="0"></div>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="btnAgregarGasto">Agregar gasto</button>
        </div>
      </div>
    </div>

    <div class="stats-section">
      <h2>Gastos registrados <span class="muted">(total: ${money(totalGastos)})</span></h2>
      <table class="data-table">
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Producto</th><th class="num">Monto</th><th></th></tr></thead>
        <tbody>
          ${gastosOrdenados.length ? gastosOrdenados.map(g => `
            <tr>
              <td>${escapeHtml(g.fecha) || '—'}</td>
              <td>${escapeHtml(g.descripcion)}</td>
              <td>${escapeHtml(g.categoria)}</td>
              <td>${escapeHtml(productoLabel(g.productoId))}</td>
              <td class="num">${money(g.monto)}</td>
              <td><button class="btn btn-small" data-delete-gasto="${escapeAttr(g.id)}">Eliminar</button></td>
            </tr>`).join('') : `<tr><td colspan="6" class="muted">Todavía no cargaste gastos.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function attachGastosHandlers() {
  const catSelect = document.getElementById('gastoCategoria');
  catSelect.addEventListener('change', () => {
    document.getElementById('gastoNuevaCategoriaField').hidden = catSelect.value !== '__nueva__';
  });

  document.getElementById('btnAgregarGasto').addEventListener('click', () => {
    let categoria = catSelect.value;
    if (categoria === '__nueva__') {
      const nueva = document.getElementById('gastoNuevaCategoria').value.trim();
      if (!nueva) { alert('Escribí el nombre de la nueva categoría.'); return; }
      categoria = nueva;
      if (!state.gastoCategorias.includes(nueva)) state.gastoCategorias.push(nueva);
    }
    const descripcion = document.getElementById('gastoDescripcion').value.trim();
    const monto = Number(document.getElementById('gastoMonto').value) || 0;
    if (!descripcion || monto <= 0) { alert('Completá una descripción y un monto mayor a 0.'); return; }
    state.gastos.push({
      id: uid('gasto'),
      fecha: document.getElementById('gastoFecha').value || todayStr(),
      descripcion,
      categoria,
      productoId: document.getElementById('gastoProducto').value,
      monto,
    });
    saveState();
    render();
  });

  document.querySelectorAll('[data-delete-gasto]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('¿Eliminar este gasto?')) return;
      state.gastos = state.gastos.filter(g => g.id !== btn.dataset.deleteGasto);
      saveState();
      render();
    });
  });
}

/* ===================== Exportación CSV ===================== */

function csvEscape(v) {
  const s = String(v ?? '');
  if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.join(';')].concat(rows.map(r => r.map(csvEscape).join(';')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  triggerDownload(blob, filename);
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function productosLista(a) {
  return PRODUCTS.filter(p => (Number(a.productos[p.id]) || 0) > 0)
    .map(p => `${p.label} x${a.productos[p.id]}`)
    .join(', ');
}

function estadoPagoLabel(a) {
  return statusInfo(a).label;
}

function medioPagoLabel(a) {
  if (!a.medioPago) return '';
  return a.medioPago === 'efectivo' ? 'Efectivo' : 'Transferencia';
}

function exportPorProducto(productId) {
  const prod = PRODUCTS.find(p => p.id === productId);
  const alumnos = state.alumnos.filter(a => (Number(a.productos[productId]) || 0) > 0).sort(sortByName);
  const headers = ['Turno', 'Sala', 'Apellido', 'Nombre', 'Cantidad', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Estado de pago', 'Medio de pago'];
  const rows = alumnos.map(a => [a.turno, a.sala, a.apellido, a.nombre, a.productos[productId], a.padre, a.telefonoPadre, a.madre, a.telefonoMadre, estadoPagoLabel(a), medioPagoLabel(a)]);
  downloadCSV(`pedidos_${slug(prod.label)}.csv`, headers, rows);
}

function exportPorSala(turno, sala) {
  const alumnos = state.alumnos.filter(a => a.turno === turno && a.sala === sala).sort(sortByName);
  const headers = ['Apellido', 'Nombre', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Productos pedidos', 'Fotos grupales', 'Fotos individuales', 'Fecha de pedido', 'Estado de pago', 'Monto abonado', 'Medio de pago', 'Total', 'Saldo pendiente', 'Notas'];
  const rows = alumnos.map(a => [
    a.apellido, a.nombre, a.padre, a.telefonoPadre, a.madre, a.telefonoMadre,
    productosLista(a) || '—',
    a.fotosGrupales.join(', '), a.fotosIndividuales.join(', '), a.fecha,
    estadoPagoLabel(a), money(calcCobrado(a)), medioPagoLabel(a),
    money(calcTotal(a)), money(calcSaldo(a)), a.notas,
  ]);
  downloadCSV(`listado_${slug(turno)}_${slug(sala)}.csv`, headers, rows);
}

function exportCompleto() {
  const alumnos = [...state.alumnos].sort((a, b) => {
    if (a.turno !== b.turno) return a.turno.localeCompare(b.turno, 'es');
    if (a.sala !== b.sala) return a.sala.localeCompare(b.sala, 'es');
    return sortByName(a, b);
  });
  const headers = ['Turno', 'Sala', 'Apellido', 'Nombre', 'Padre', 'Teléfono padre', 'Madre', 'Teléfono madre', 'Productos pedidos', 'Fotos grupales', 'Fotos individuales', 'Fecha de pedido', 'Estado de pago', 'Monto abonado', 'Medio de pago', 'Total', 'Saldo pendiente'];
  const rows = alumnos.map(a => [
    a.turno, a.sala, a.apellido, a.nombre, a.padre, a.telefonoPadre, a.madre, a.telefonoMadre,
    productosLista(a) || '—', a.fotosGrupales.join(', '), a.fotosIndividuales.join(', '), a.fecha,
    estadoPagoLabel(a), money(calcCobrado(a)), medioPagoLabel(a),
    money(calcTotal(a)), money(calcSaldo(a)),
  ]);
  downloadCSV('listado_completo.csv', headers, rows);
}

function slug(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase();
}

/* ===================== Backup JSON ===================== */

function exportBackup() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const today = new Date().toISOString().slice(0, 10);
  triggerDownload(blob, `backup_fotos_jardin_${today}.json`);
}

function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.alumnos)) throw new Error('El archivo no tiene el formato esperado.');
      const ok = confirm(`Se va a reemplazar toda la información cargada por la del archivo "${file.name}" (${parsed.alumnos.length} alumnos). ¿Continuar?`);
      if (!ok) return;
      state = parsed;
      saveState();
      render();
      alert('Backup importado correctamente.');
    } catch (err) {
      alert('No se pudo importar el archivo: ' + err.message);
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
}

/* ===================== Utilidades ===================== */

function normalize(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

</script>
